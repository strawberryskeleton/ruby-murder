<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruby Murder</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./main.js" defer></script>
</head>
<body>
    <div id="game-stats">
        <div>Time Left: <span id="timer">60</span></div>
        <div>Score: <span id="score">0</span></div>
    </div>

    <div id="game-container">
        <div id="game-track">
            <div id="target"></div>
            <div id="slider"></div>
        </div>

        <div id="start-screen">
            <h2>Ruby Murder</h2>
            <p>Use your mouse to scoll the crow up and down to collect as many rubies as you can in 60 seconds</p>
            <button id="start-btn" onclick="startTimer()">Start Game</button>
        </div>
    </div>

</body>
</html>
