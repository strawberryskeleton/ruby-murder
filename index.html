<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruby Murder</title>
    <link rel="icon" type="image/x-icon" href="./assets/ruby2.png">
    <link rel="stylesheet" href="./style.css">
    <script src="./main.js" defer></script>
</head>
<body>
    <div id="game-stats">
        <div>Time Left: <span id="timer">60</span></div>
        <div>Score: <span id="score">0</span></div>
    </div>

    <div id="game-container">
        <div id="game-track">
            <div id="target">
                <img src="./assets/ruby2.png" alt="Target Ruby">
            </div>
            <div id="slider">
                <img src="./assets/crow-nobg.png" alt="Slider Crow">
            </div>
        </div>

        <div id="start-screen">
            <!-- <h2>Ruby Murder</h2> -->
            <img src="./assets/logo.png" alt="Ruby Murder Logo" id="title">
            <p>Use your mouse to scoll the crow up and down to collect as many rubies as you can in 60 seconds</p>
            <button id="start-btn" class="btn">Start Game</button>
        </div>

        <div id="end-screen" class="hidden">
            <h2>Time's Up!</h2>
            <p>You managed to collect</p>
            <div id="final-score-display"><span id="final-score">0</span> rubies</div>
            <button id="restart-btn" class="btn">Play Again</button>
        </div>
    </div>

</body>
</html>
